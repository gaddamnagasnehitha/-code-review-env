[project]
name = "code-review-env"
version = "0.1.0"
description = "Code Review Assistant OpenEnv Environment"
authors = [{ name="Snehitha" }]

dependencies = [
  "pydantic",
  "openai",
  "fastapi",
  "uvicorn",
  "openenv-core"
]

[tool.openenv]
entrypoint = "env.environment:CodeReviewEnv"

[project.scripts]
server = "server.app:main"